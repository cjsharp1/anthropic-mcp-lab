<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MCP Lab">
  <!-- Two nodes and a link: a client and a server with the protocol
       between them. Drawn with currentColor-independent explicit
       fills because a favicon is rendered outside the page and
       inherits nothing from the stylesheet. -->
  <rect width="32" height="32" rx="6" fill="#1e1c17"/>
  <line x1="10" y1="16" x2="22" y2="16" stroke="#7fb3d1" stroke-width="2"/>
  <circle cx="9" cy="16" r="4" fill="#7fb3d1"/>
  <circle cx="23" cy="16" r="4" fill="#8fb58c"/>
</svg>
